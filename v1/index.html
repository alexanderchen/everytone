<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Everytone</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- 1. Immersive Top Performance Canvas (Pushed up smoothly when Bottom UX Panel expands) -->
  <main class="performance-canvas" id="videoStage">
    <canvas id="webglStageBg" class="webgl-stage-bg"></canvas>

    <div class="poly-video-strip" id="polyVideoGrid">
      <div class="stage-slot-unit" data-slot="0">
        <div class="stage-slot-video"></div>
        <canvas class="slot-mini-spec" width="320" height="96"></canvas>
      </div>
      <div class="stage-slot-unit" data-slot="1">
        <div class="stage-slot-video"></div>
        <canvas class="slot-mini-spec" width="320" height="96"></canvas>
      </div>
      <div class="stage-slot-unit" data-slot="2">
        <div class="stage-slot-video"></div>
        <canvas class="slot-mini-spec" width="320" height="96"></canvas>
      </div>
    </div>

    <section class="keyboard-dock">
      <div class="keyline-scroll-wrap" id="keylineScrollWrap">
        <div class="keyline-keyboard fit-mode" id="pianoKeyboard"></div>
      </div>
    </section>
  </main>

  <!-- 2. Full-Width Expanding Bottom UX Panel + Lower-Right Material Settings Gear -->
  <div class="bottom-ux-shell" id="sampleDrawerWrap">
    <button
      id="sampleDrawerToggleBtn"
      type="button"
      class="sample-drawer-gear-btn"
      aria-expanded="false"
      title="Expand / collapse settings &amp; samples"
    >
      <!-- Official Google Material Icons 'settings' 24dp vector -->
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
      </svg>
    </button>

    <section class="bottom-ux-panel collapsed" id="sampleDrawer">
      <div class="settings-samples-row">
        <div class="selected-note-pill" id="selectedNoteTag">C4</div>
        <div class="candidates-strip" id="candidatesGrid"></div>
      </div>

      <div class="midi-transport-bar">
        <input id="midiFileInput" type="file" accept=".mid,.midi" class="hidden" />
        <button id="midiUploadBtn" type="button" class="midi-pill-btn" title="Upload a Standard MIDI File (.mid)">
          Load MIDI
        </button>
        <span id="midiFileLabel" class="midi-file-label">No MIDI loaded</span>

        <div class="midi-transport-controls">
          <button id="midiPlayPauseBtn" type="button" class="midi-icon-btn" disabled title="Play / Pause MIDI">
            <span id="midiPlayPauseIcon">▶</span>
          </button>
          <button id="midiRestartBtn" type="button" class="midi-icon-btn" disabled title="Restart MIDI from beginning">
            ↺
          </button>
        </div>
      </div>
    </section>
  </div>

  <!-- Universal Clip Inspector Overlay (Rename + Inline Reference Tone / Slot + Tall Spectrogram + Trim + Confirm Trash) -->
  <div class="drawer-backdrop hidden" id="trimModal">
    <div class="trim-modal-card">
      <div class="trim-modal-header">
        <div class="inspector-title-row">
          <input
            id="inspectorSlugInput"
            type="text"
            class="inspector-slug-input"
            value=""
            spellcheck="false"
            title="Edit object name (renames sample folder &amp; files on Enter or click-away)"
          />

          <div class="inspector-slot-wrap" title="Audition reference tones across notes and assign this clip's MIDI slot">
            <span class="inspector-slot-tag">Note</span>
            <button
              id="inspectorSlotPrevBtn"
              type="button"
              class="slot-step-btn"
              title="Step down 1 semitone &amp; play reference tone"
            >
              ◀
            </button>
            <select id="inspectorSlotSelect" class="inspector-slot-select"></select>
            <button
              id="inspectorSlotNextBtn"
              type="button"
              class="slot-step-btn"
              title="Step up 1 semitone &amp; play reference tone"
            >
              ▶
            </button>
            <button
              id="inspectorTestToneBtn"
              type="button"
              class="test-tone-btn"
              title="Play pure reference test tone at this note's frequency"
            >
              ♪ Tone
            </button>
            <button
              id="inspectorAssignSlotBtn"
              type="button"
              class="assign-slot-btn hidden"
              title="Move clip permanently to this MIDI slot at original 1.0x pitch"
            >
              Move → C4
            </button>
          </div>

          <button
            id="inspectorResetDspBtn"
            type="button"
            class="inspector-reset-dsp-btn hidden"
            title="Revert clip back to its DSP-suggested MIDI note slot and tuning"
          >
            ↺ Reset to DSP
          </button>
        </div>
        <button class="close-drawer-btn" data-close="trimModal">✕ Close</button>
      </div>

      <div class="trim-modal-body">
        <!-- Left: Live 1:1 Square Scrub Video + Rotate + Preview Trigger -->
        <div class="trim-video-col">
          <div class="trim-video-square">
            <video id="trimScrubVideo" playsinline preload="auto"></video>
          </div>
          <div class="trim-video-meta-row">
            <span class="trim-scrub-time" id="trimScrubTimeReadout">Frame @ 0.00s</span>
            <button id="inspectorRotateBtn" type="button" class="ghost-btn tiny" title="Rotate video 90°">↻ 90°</button>
          </div>
          <button id="trimPreviewBtn" type="button" class="trim-btn-secondary full-w">
            ▶ Preview (Space)
          </button>
        </div>

        <!-- Right: Tall Immersive Spectrogram + Clean Re-Pitch + Draggable [ IN ... OUT ] Trim -->
        <div class="trim-timeline-col">
          <!-- 1. Tall Log-Frequency Spectrogram -->
          <div class="inspector-spec-block">
            <div class="inspector-subbar">
              <span class="inspector-section-label">SPECTROGRAM</span>
              <span class="inspector-spec-meta" id="inspectorSpecMeta">--</span>
            </div>
            <div class="inspector-spec-stage">
              <canvas id="inspectorSpectrogramCanvas" width="600" height="248"></canvas>
              <div class="inspector-spec-playhead" id="inspectorSpecPlayhead"></div>
            </div>
            <div class="inspector-tune-row" id="inspectorTuneRow">
              <span class="peaks-mini-label">Re-Pitch</span>
              <input
                id="inspectorTuneSlider"
                type="range"
                min="-1200"
                max="1200"
                step="5"
                value="0"
                class="inspector-tune-slider"
                title="Fine-tune or re-pitch clip (−12 to +12 semitones)"
              />
              <span class="inspector-tune-readout" id="inspectorTuneReadout">0c · 1.00x</span>
              <button
                id="inspectorZeroTuneBtn"
                type="button"
                class="nudge-btn hidden"
                title="Reset to un-shifted original pitch (0c · 1.00x)"
              >
                0c
              </button>
            </div>
          </div>

          <!-- 2. Single-Clip Waveform + Non-Destructive [ IN ... OUT ] Sub-Trim -->
          <div class="inspector-trim-block">
            <div class="trim-view-bar">
              <span class="inspector-section-label">TRIM</span>
              <div class="trim-bar-right">
                <span class="trim-span-meta" id="trimSpanMeta">0.00s – 2.00s · 2.00s</span>
                <button
                  id="trimResetBtn"
                  class="inspector-reset-dsp-btn hidden"
                  type="button"
                  title="Restore full DSP-cropped sample length"
                >
                  ↺ Reset Full Sample
                </button>
              </div>
            </div>

            <div class="trim-timeline-stage" id="trimTimelineStage">
              <canvas id="trimWaveformCanvas" width="600" height="96"></canvas>
              <div class="trim-curtain left" id="trimCurtainLeft"></div>
              <div class="trim-curtain right" id="trimCurtainRight"></div>
              <div class="trim-window-box" id="trimWindowBox" title="Drag middle to slide In &amp; Out together">
                <div class="trim-handle in-handle" id="trimHandleIn" title="Drag IN start point">
                  <span class="handle-grip"></span>
                  <span class="handle-tag" id="trimHandleInTag">IN</span>
                </div>
                <div class="trim-playhead" id="trimPlayhead"></div>
                <div class="trim-handle out-handle" id="trimHandleOut" title="Drag OUT end point">
                  <span class="handle-grip"></span>
                  <span class="handle-tag" id="trimHandleOutTag">OUT</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="trim-modal-footer">
        <button id="inspectorTrashClipBtn" class="ghost-btn small danger-text" type="button" title="Move this clip to _trash/">
          Move Clip to Trash
        </button>

        <div class="trim-footer-right">
          <button id="trimSaveBtn" type="button" class="trim-btn-primary">
            ✓ Save Trim
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
