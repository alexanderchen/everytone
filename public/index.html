<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Everytone</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Unified Far Top-Left Hamburger Toggle (Collapses/Expands Sidebar + Bottom Transport Together) -->
  <button
    id="chromeToggleBtn"
    type="button"
    class="chrome-hamburger-btn"
    aria-label="Toggle Video Sidebar and Bottom Transport"
    title="Toggle Video Sidebar &amp; Bottom Transport"
  >
    <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
      <line x1="2.5" y1="4" x2="13.5" y2="4"></line>
      <line x1="2.5" y1="8" x2="13.5" y2="8"></line>
      <line x1="2.5" y1="12" x2="13.5" y2="12"></line>
    </svg>
  </button>

  <!-- 1. Upper Workspace: Left Collapsible Video File Explorer + Right Three.js 3D Stage -->
  <div class="upper-workspace">
    <aside class="file-explorer" id="fileExplorer">
      <div class="explorer-header">
        <span class="explorer-count" id="explorerActiveCount">0/0</span>
      </div>

      <div class="explorer-scroll-list" id="explorerList"></div>

      <!-- Discreet Stage Display Config (Visible Only When Sidebar Menu Is Open) -->
      <div class="explorer-stage-config" id="explorerStageConfig">
        <div class="stage-cfg-row">
          <span class="stage-cfg-label">Grid</span>
          <div class="stage-grid-pills" role="group" aria-label="Foreground stage tile grid">
            <button type="button" class="stage-grid-pill is-active" data-grid-mode="3x1" title="Single row of 3 film tiles">3×1</button>
            <button type="button" class="stage-grid-pill" data-grid-mode="2x2" title="2×2 grid (4 film tiles)">2×2</button>
            <button type="button" class="stage-grid-pill" data-grid-mode="3x2" title="Double row of 3 film tiles (6 tiles)">3×2</button>
            <button type="button" class="stage-grid-pill" data-grid-mode="3x3" title="3×3 grid (9 film tiles)">3×3</button>
          </div>
        </div>
        <div class="stage-cfg-row">
          <span class="stage-cfg-label">Fade</span>
          <div class="stage-fade-wrap" title="Visual fade-out duration when releasing notes (0.2s to 1.0s)">
            <input
              id="stageFadeSlider"
              type="range"
              min="0.2"
              max="1.0"
              step="0.1"
              value="0.2"
              class="stage-fade-slider"
            />
            <span class="stage-fade-val" id="stageFadeReadout">0.2s</span>
          </div>
        </div>
      </div>
    </aside>

    <main class="performance-canvas" id="videoStage">
      <canvas id="threeStageCanvas" class="three-stage-bg"></canvas>

      <div class="poly-video-strip" id="polyVideoGrid">
        <div class="stage-slot-unit" data-slot="0">
          <div class="stage-slot-video"></div>
          <canvas class="slot-mini-spec" width="320" height="96"></canvas>
        </div>
        <div class="stage-slot-unit" data-slot="1">
          <div class="stage-slot-video"></div>
          <canvas class="slot-mini-spec" width="320" height="96"></canvas>
        </div>
        <div class="stage-slot-unit" data-slot="2">
          <div class="stage-slot-video"></div>
          <canvas class="slot-mini-spec" width="320" height="96"></canvas>
        </div>
        <div class="stage-slot-unit hidden" data-slot="3">
          <div class="stage-slot-video"></div>
          <canvas class="slot-mini-spec" width="320" height="96"></canvas>
        </div>
        <div class="stage-slot-unit hidden" data-slot="4">
          <div class="stage-slot-video"></div>
          <canvas class="slot-mini-spec" width="320" height="96"></canvas>
        </div>
        <div class="stage-slot-unit hidden" data-slot="5">
          <div class="stage-slot-video"></div>
          <canvas class="slot-mini-spec" width="320" height="96"></canvas>
        </div>
        <div class="stage-slot-unit hidden" data-slot="6">
          <div class="stage-slot-video"></div>
          <canvas class="slot-mini-spec" width="320" height="96"></canvas>
        </div>
        <div class="stage-slot-unit hidden" data-slot="7">
          <div class="stage-slot-video"></div>
          <canvas class="slot-mini-spec" width="320" height="96"></canvas>
        </div>
        <div class="stage-slot-unit hidden" data-slot="8">
          <div class="stage-slot-video"></div>
          <canvas class="slot-mini-spec" width="320" height="96"></canvas>
        </div>
      </div>
    </main>
  </div>

  <!-- 2. Collapsible Bottom Bar: Optional Note Sample Drawer + Frugal Wide Keyboard Row -->
  <footer class="bottom-transport-dock" id="transportDock">
    <!-- Collapsible Single-Note Sample Shelf (Collapsed by Default on Load) -->
    <section class="note-samples-drawer collapsed" id="noteSamplesDrawer">
      <div class="samples-drawer-meta">
        <div class="samples-drawer-heading">
          <span class="samples-drawer-dot" id="drawerNoteDot"></span>
          <span class="samples-drawer-note" id="drawerNoteName">C4</span>
        </div>
        <span class="samples-drawer-sub" id="drawerNoteSub">261.6 Hz</span>
      </div>

      <div class="candidates-strip" id="candidatesGrid"></div>

      <button
        id="collapseNoteSamplesBtn"
        type="button"
        class="drawer-collapse-btn"
        title="Collapse sample view for active note"
      >
        ▾ Hide
      </button>
    </section>

    <!-- Main Frugal Row: [ MIDI Transport ] | [ Selected Note + Pencil ] | [ Wide 3–6 Oct Keyboard ] | [ Octave Switcher ] -->
    <div class="dock-main-row">
      <!-- Far Left: Compact MIDI Player & Scrubbable Play Bar -->
      <section class="dock-zone transport-zone" id="midiTransportZone">
        <div class="transport-top-row">
          <input id="midiFileInput" type="file" accept=".mid,.midi" class="hidden" />
          <button id="midiUploadBtn" type="button" class="midi-load-btn" title="Load a Standard MIDI File (.mid)">
            Load MIDI
          </button>
          <span id="midiFileLabel" class="midi-file-label">No MIDI</span>
          <div class="midi-transpose-ctrl" title="Transpose MIDI file by whole octaves">
            <button id="midiOctDownBtn" type="button" class="midi-oct-btn" title="Transpose MIDI down 1 octave">−</button>
            <span id="midiOctReadout" class="midi-oct-readout">0 oct</span>
            <button id="midiOctUpBtn" type="button" class="midi-oct-btn" title="Transpose MIDI up 1 octave">+</button>
          </div>
        </div>

        <div class="transport-scrub-row">
          <button id="midiPlayPauseBtn" type="button" class="midi-play-btn" disabled title="Play / Pause MIDI">
            <span id="midiPlayPauseIcon">▶</span>
          </button>

          <div class="midi-scrub-track is-disabled" id="midiScrubTrack" title="Drag to scrub through MIDI file">
            <span class="scrub-endpoint left"></span>
            <div class="scrub-rail">
              <div class="scrub-fill" id="midiScrubFill"></div>
              <div class="scrub-playhead" id="midiScrubThumb"></div>
            </div>
            <span class="scrub-endpoint right"></span>
          </div>

          <span id="midiTimeReadout" class="midi-time-readout">0:00</span>
        </div>
      </section>

      <!-- Left of Keyboard: Selected Note Indicator + Pencil Edit Toggle -->
      <section class="dock-zone selected-note-zone" id="selectedNoteZone">
        <button
          id="noteSamplesToggleBtn"
          type="button"
          class="selected-note-btn"
          aria-expanded="false"
          title="Edit samples for selected note"
        >
          <span class="sel-note-main">
            <span class="sel-note-dot" id="selectedNoteDot"></span>
            <span class="sel-note-name" id="selectedNoteLabel">C4</span>
          </span>
          <span class="sel-note-edit-row">
            <span class="sel-note-count" id="selectedNoteCount">0</span>
            <svg class="sel-note-pencil" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M11.4 2.4a1.5 1.5 0 0 1 2.1 2.1L5.4 12.6 2 13.6l1-3.4 8.4-7.8z"></path>
            </svg>
          </span>
        </button>
      </section>

      <!-- Wide Center: Full-Height Responsive Connected Wireframe Keyline Keyboard (3 to 6 Octaves) -->
      <section class="dock-zone keyboard-zone" id="keyboardZone">
        <div class="wireframe-keyboard-wrap">
          <div class="wireframe-keyboard" id="pianoKeyboard"></div>
        </div>
      </section>

      <!-- Right of Keyboard: Frugal Octave Range + Square Left/Right Buttons -->
      <section class="dock-zone octave-rail-zone" id="octaveRailZone">
        <span id="octaveRangeLabel" class="oct-range-label">C2–B7</span>
        <div class="oct-square-pair">
          <button id="octDownBtn" type="button" class="oct-square-btn" title="Shift keyboard down 1 octave (Z)">◀</button>
          <button id="octUpBtn" type="button" class="oct-square-btn" title="Shift keyboard up 1 octave (X)">▶</button>
        </div>
      </section>
    </div>
  </footer>

  <!-- 3A. Grouped Video Inspector Overlay (Editable Group Name + Scrolling Multi-Video Editor) -->
  <div class="drawer-backdrop hidden" id="videoInspectorModal">
    <div class="trim-modal-card video-inspector-card">
      <div class="trim-modal-header">
        <div class="inspector-title-row">
          <span class="crumb-type-badge" id="videoInspBadge">GROUP</span>
          <div class="group-name-edit-wrap" title="Edit readable instrument group name">
            <input
              id="videoInspGroupInput"
              type="text"
              class="inspector-group-input"
              value=""
              spellcheck="false"
              placeholder="group name"
            />
            <svg class="group-edit-pencil local-only-btn" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M11.4 2.4a1.5 1.5 0 0 1 2.1 2.1L5.4 12.6 2 13.6l1-3.4 8.4-7.8z"></path>
            </svg>
          </div>
          <span class="video-insp-meta-pill" id="videoInspMetaPill">WINDS · 4 VIDEOS · 8 SAMPLES</span>
          <button
            id="videoInspGroupSwitch"
            type="button"
            class="ui-switch is-on"
            role="switch"
            aria-checked="true"
            title="Enable or mute all videos in this group"
          ></button>
        </div>
        <button class="close-drawer-btn" data-close="videoInspectorModal">✕ Close</button>
      </div>

      <div class="trim-modal-body group-inspector-body">
        <div class="trim-video-col">
          <div class="trim-video-square">
            <video id="videoInspPreviewVideo" playsinline preload="auto"></video>
          </div>
          <div class="trim-video-meta-row">
            <span class="trim-scrub-time" id="videoInspTimeReadout">Sample #1</span>
            <button id="videoInspRotateBtn" type="button" class="ghost-btn tiny local-only-btn" title="Rotate selected video 90°">↻ 90°</button>
          </div>
          <button id="videoInspPreviewBtn" type="button" class="trim-btn-secondary full-w">
            ▶ Preview (Space)
          </button>
        </div>

        <div class="group-videos-scroll-col" id="videoInspVideosScroll"></div>
      </div>

      <div class="trim-modal-footer group-inspector-footer">
        <span class="group-footer-hint">Click any sample row to audition · Edit group name above to rename or merge</span>
        <div class="trim-footer-right">
          <button type="button" class="trim-btn-primary" data-close="videoInspectorModal">
            Done
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 3B. Individual Sample Inspector Overlay (Group/Video Crumb › Sample + Pitch Slot + Spectrogram + Trim) -->
  <div class="drawer-backdrop hidden" id="trimModal">
    <div class="trim-modal-card">
      <div class="trim-modal-header">
        <div class="inspector-title-row">
          <div class="inspector-breadcrumb">
            <span class="crumb-type-badge">GROUP:</span>
            <button
              id="sampleInspParentBtn"
              type="button"
              class="crumb-video-link"
              title="Open parent Group Inspector (edit all videos &amp; holistic volumes in this group)"
            >
              purple bottle
            </button>
            <span class="crumb-sep">›</span>
            <span class="crumb-sample-name" id="sampleInspSliceLabel">Sample #1</span>
          </div>

          <div class="inspector-slot-wrap" title="Audition reference tones across notes and assign this sample's MIDI slot">
            <span class="inspector-slot-tag">Note</span>
            <button
              id="inspectorSlotPrevBtn"
              type="button"
              class="slot-step-btn"
              title="Step down 1 semitone &amp; play reference tone"
            >
              ◀
            </button>
            <select id="inspectorSlotSelect" class="inspector-slot-select"></select>
            <button
              id="inspectorSlotNextBtn"
              type="button"
              class="slot-step-btn"
              title="Step up 1 semitone &amp; play reference tone"
            >
              ▶
            </button>
            <button
              id="inspectorTestToneBtn"
              type="button"
              class="test-tone-btn"
              title="Play pure reference test tone at this note's frequency"
            >
              ♪ Tone
            </button>
            <button
              id="inspectorAssignSlotBtn"
              type="button"
              class="assign-slot-btn hidden"
              title="Move sample permanently to this MIDI slot at original 1.0x pitch"
            >
              Move → C4
            </button>
          </div>

          <button
            id="inspectorResetDspBtn"
            type="button"
            class="inspector-reset-dsp-btn hidden"
            title="Revert sample back to its DSP-suggested MIDI note slot and tuning"
          >
            ↺ Reset to DSP
          </button>
        </div>
        <button class="close-drawer-btn" data-close="trimModal">✕ Close</button>
      </div>

      <div class="trim-modal-body">
        <div class="trim-video-col">
          <div class="trim-video-square">
            <video id="trimScrubVideo" playsinline preload="auto"></video>
          </div>
          <div class="trim-video-meta-row">
            <span class="trim-scrub-time" id="trimScrubTimeReadout">Frame @ 0.00s</span>
            <button id="inspectorRotateBtn" type="button" class="ghost-btn tiny local-only-btn" title="Rotate video 90°">↻ 90°</button>
          </div>
          <button id="trimPreviewBtn" type="button" class="trim-btn-secondary full-w">
            ▶ Preview (Space)
          </button>
        </div>

        <div class="trim-timeline-col">
          <!-- 1. Log/Perceptual Spectrogram -->
          <div class="inspector-spec-block">
            <div class="inspector-subbar">
              <span class="inspector-section-label">SPECTROGRAM</span>
              <span class="inspector-spec-meta" id="inspectorSpecMeta">--</span>
            </div>
            <div class="inspector-spec-stage">
              <canvas id="inspectorSpectrogramCanvas" width="600" height="248"></canvas>
              <div class="inspector-spec-playhead" id="inspectorSpecPlayhead"></div>
            </div>
            <div class="inspector-tune-row" id="inspectorTuneRow">
              <span class="peaks-mini-label">Re-Pitch</span>
              <input
                id="inspectorTuneSlider"
                type="range"
                min="-100"
                max="100"
                step="1"
                value="0"
                class="inspector-tune-slider"
                title="Fine-tune sample (−1 to +1 semitone / ±100 cents max)"
              />
              <span class="inspector-tune-readout" id="inspectorTuneReadout">0c · 1.00x</span>
              <button
                id="inspectorZeroTuneBtn"
                type="button"
                class="nudge-btn hidden"
                title="Reset to un-shifted original pitch (0c · 1.00x)"
              >
                0c
              </button>
            </div>
          </div>

          <!-- 2. Single-Clip Waveform + Non-Destructive [ IN ... OUT ] Sub-Trim -->
          <div class="inspector-trim-block">
            <div class="trim-view-bar">
              <span class="inspector-section-label">TRIM</span>
              <div class="trim-bar-right">
                <span class="trim-span-meta" id="trimSpanMeta">0.00s – 2.00s · 2.00s</span>
                <button
                  id="trimResetBtn"
                  class="inspector-reset-dsp-btn hidden"
                  type="button"
                  title="Restore full DSP-cropped sample length"
                >
                  ↺ Reset Full Sample
                </button>
              </div>
            </div>

            <div class="trim-timeline-stage" id="trimTimelineStage">
              <canvas id="trimWaveformCanvas" width="600" height="96"></canvas>
              <div class="trim-curtain left" id="trimCurtainLeft"></div>
              <div class="trim-curtain right" id="trimCurtainRight"></div>
              <div class="trim-window-box" id="trimWindowBox" title="Drag middle to slide In &amp; Out together">
                <div class="trim-handle in-handle" id="trimHandleIn" title="Drag IN start point">
                  <span class="handle-grip"></span>
                  <span class="handle-tag" id="trimHandleInTag">IN</span>
                </div>
                <div class="trim-playhead" id="trimPlayhead"></div>
                <div class="trim-handle out-handle" id="trimHandleOut" title="Drag OUT end point">
                  <span class="handle-grip"></span>
                  <span class="handle-tag" id="trimHandleOutTag">OUT</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="trim-modal-footer local-only-btn">
        <button id="inspectorTrashClipBtn" class="ghost-btn small danger-text local-only-btn" type="button" title="Move this sample clip to _trash/">
          Move Sample to Trash
        </button>

        <div class="trim-footer-right">
          <button id="trimSaveBtn" type="button" class="trim-btn-primary local-only-btn">
            ✓ Save Trim
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
