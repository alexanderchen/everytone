<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Everything Piano</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- 1. Quiet Minimal Top Controls Bar -->
  <header class="topbar">
    <div class="topbar-spacer"></div>

    <div class="topbar-actions">
      <button id="inspectLatestBtn" class="drawer-btn" title="Inspect spectrogram, pitch, and In/Out trim of the active clip">
        <span>Inspect Clip</span>
      </button>

      <div class="divider-v"></div>

      <button id="wurliToggleBtn" class="ctrl-btn" title="Toggle built-in Wurlitzer electric piano layer">
        <span class="led"></span>
        <span>Wurli: <b id="wurliStatusText">OFF</b></span>
      </button>

      <div class="slider-ctrl" title="Release decay time after lifting your finger from a key">
        <label for="releaseSlider">Release</label>
        <input type="range" id="releaseSlider" min="0.20" max="1.40" value="0.65" step="0.05" />
        <span id="releaseVal">0.65s</span>
      </div>

      <div class="slider-ctrl" title="Master low-cut filter for sample playback">
        <label for="hpSlider">HPF</label>
        <input type="range" id="hpSlider" min="35" max="260" value="85" step="5" />
        <span id="hpVal">85Hz</span>
      </div>

      <div class="midi-badge" id="midiBadge" title="Hardware Web MIDI + Computer QWERTY Keyboard">
        <span class="midi-dot" id="midiDot"></span>
        <span id="midiText">QWERTY C4 (Z/X)</span>
      </div>
    </div>
  </header>

  <!-- 2. Full-Width Centered Immersive 3-Slot Stage + Left-to-Right Unveiling Spectrograms -->
  <section class="hero-stage-row">
    <div class="video-stage" id="videoStage">
      <div class="poly-video-strip" id="polyVideoGrid">
        <div class="stage-slot-unit" data-slot="0">
          <div class="stage-slot-video"></div>
          <canvas class="slot-mini-spec" width="240" height="54"></canvas>
        </div>
        <div class="stage-slot-unit" data-slot="1">
          <div class="stage-slot-video"></div>
          <canvas class="slot-mini-spec" width="240" height="54"></canvas>
        </div>
        <div class="stage-slot-unit" data-slot="2">
          <div class="stage-slot-video"></div>
          <canvas class="slot-mini-spec" width="240" height="54"></canvas>
        </div>
      </div>
    </div>
  </section>

  <!-- 3. Streamlined Horizontal Candidate Strip for the Selected Key -->
  <section class="candidate-strip-section">
    <div class="candidate-strip-sidebar">
      <div class="key-nav-row">
        <button id="prevKeyBtn" class="nav-arrow-btn" title="Previous half-step (Left Arrow)">←</button>
        <div class="selected-note-hero">
          <span class="hero-note-name" id="selectedKeyName">C4</span>
        </div>
        <button id="nextKeyBtn" class="nav-arrow-btn" title="Next half-step (Right Arrow)">→</button>
        <button id="nextPopulatedKeyBtn" class="nav-arrow-btn wide" title="Next populated key (Shift + Right Arrow)">⇥</button>
      </div>

      <div class="candidate-sidebar-meta">
        <span class="hero-note-meta" id="selectedKeyMeta">261.6 Hz</span>
        <span class="candidate-summary-label" id="candidateSummaryLabel">0 / 0 ON</span>
      </div>
    </div>

    <!-- Horizontal Strip of Compact Candidate Cards (ON/OFF Multi-Select) -->
    <div class="candidates-strip" id="candidatesGrid"></div>
  </section>

  <!-- 4. Slim Minimal Note-Name Keyboard Bars (C1–B1 Percussion + C2–G7 Tonal) -->
  <section class="keyboard-dock">
    <div class="keyboard-bar">
      <div class="kb-right-tools">
        <div class="octave-stepper">
          <button id="octDownBtn" class="mini-key-btn" title="Shift QWERTY octave down (Z)">◀ Z</button>
          <span id="octaveLabel" class="octave-readout">QWERTY: C4 – F5</span>
          <button id="octUpBtn" class="mini-key-btn" title="Shift QWERTY octave up (X)">X ▶</button>
        </div>

        <div class="zoom-toggle">
          <button id="fitKeysBtn" class="mini-key-btn active" title="Fit all 80 equal-width keys across screen">Fit All</button>
          <button id="wideKeysBtn" class="mini-key-btn" title="Wider equal-width keys with horizontal scroll">Wide</button>
        </div>
      </div>
    </div>

    <div class="keyline-scroll-wrap" id="keylineScrollWrap">
      <div class="keyline-keyboard fit-mode" id="pianoKeyboard"></div>
    </div>
  </section>

  <!-- Universal Clip Inspector Overlay (Rename + Rotate + Deeper Spectrogram + Pitch Override + Trim + Trash) -->
  <div class="drawer-backdrop hidden" id="trimModal">
    <div class="trim-modal-card">
      <div class="trim-modal-header">
        <div class="inspector-title-row">
          <input
            id="inspectorSlugInput"
            type="text"
            class="inspector-slug-input"
            value=""
            spellcheck="false"
            title="Edit object shorthand name (Enter or click away to save)"
          />
          <span class="inspector-note-label" id="inspectorNoteLabel">--</span>
          <span class="spec-f0-badge" id="inspectorF0Badge">f0: -- Hz</span>
        </div>
        <button class="close-drawer-btn" data-close="trimModal">✕ Close</button>
      </div>

      <div class="trim-modal-body">
        <!-- Left: Live 1:1 Square Scrub Video + Rotate + Preview Trigger -->
        <div class="trim-video-col">
          <div class="trim-video-square">
            <video id="trimScrubVideo" playsinline preload="auto"></video>
          </div>
          <div class="trim-video-meta-row">
            <span class="trim-scrub-time" id="trimScrubTimeReadout">Frame @ 0.00s</span>
            <button id="inspectorRotateBtn" type="button" class="ghost-btn tiny" title="Rotate video 90°">↻ 90°</button>
          </div>
          <button id="trimPreviewBtn" type="button" class="trim-btn-secondary full-w">
            ▶ Preview (Space)
          </button>
        </div>

        <!-- Right: Deeper Spectrogram + Optional Pitch Override + Draggable [ IN ... OUT ] Trim -->
        <div class="trim-timeline-col">
          <!-- 1. Deeper Log-Frequency Spectrogram + f0 & Harmonics -->
          <div class="inspector-spec-block">
            <div class="inspector-subbar">
              <span class="inspector-section-label">SPECTROGRAM &amp; HARMONICS</span>
              <span class="inspector-spec-meta" id="inspectorSpecMeta">--</span>
            </div>
            <div class="inspector-spec-stage">
              <canvas id="inspectorSpectrogramCanvas" width="520" height="148"></canvas>
              <div class="inspector-spec-playhead" id="inspectorSpecPlayhead"></div>
            </div>
            <div class="inspector-peaks-row hidden" id="inspectorPeaksRow">
              <span class="peaks-mini-label">Pitch Override:</span>
              <div class="peaks-list" id="inspectorPeaksList"></div>
            </div>
          </div>

          <!-- 2. Interactive Waveform + Draggable [ IN ... OUT ] Trim Handles -->
          <div class="inspector-trim-block">
            <div class="trim-view-bar">
              <span class="inspector-section-label">TRIM IN / OUT</span>
              <div class="trim-zoom-pills">
                <button id="trimZoomClipBtn" class="kb-pill active" type="button">Around Clip</button>
                <button id="trimZoomFullBtn" class="kb-pill" type="button">Full Video</button>
              </div>
            </div>

            <div class="trim-timeline-stage" id="trimTimelineStage">
              <canvas id="trimWaveformCanvas" width="520" height="108"></canvas>
              <div class="trim-curtain left" id="trimCurtainLeft"></div>
              <div class="trim-curtain right" id="trimCurtainRight"></div>
              <div class="trim-window-box" id="trimWindowBox" title="Drag middle to slide In &amp; Out together">
                <div class="trim-handle in-handle" id="trimHandleIn" title="Drag IN start point">
                  <span class="handle-grip"></span>
                  <span class="handle-tag" id="trimHandleInTag">IN</span>
                </div>
                <div class="trim-playhead" id="trimPlayhead"></div>
                <div class="trim-handle out-handle" id="trimHandleOut" title="Drag OUT end point">
                  <span class="handle-grip"></span>
                  <span class="handle-tag" id="trimHandleOutTag">OUT</span>
                </div>
              </div>
            </div>

            <!-- Fine Nudge & Numeric Readouts -->
            <div class="trim-readouts-row">
              <div class="trim-nudge-group">
                <span class="nudge-label in-color">IN</span>
                <button type="button" class="nudge-btn" data-nudge="in" data-delta="-0.05">−0.05s</button>
                <strong class="nudge-val" id="trimInVal">0.00s</strong>
                <button type="button" class="nudge-btn" data-nudge="in" data-delta="0.05">+0.05s</button>
              </div>

              <div class="trim-nudge-group">
                <span class="nudge-label out-color">OUT</span>
                <button type="button" class="nudge-btn" data-nudge="out" data-delta="-0.05">−0.05s</button>
                <strong class="nudge-val" id="trimOutVal">2.00s</strong>
                <button type="button" class="nudge-btn" data-nudge="out" data-delta="0.05">+0.05s</button>
              </div>

              <div class="trim-len-pill">
                Length: <strong id="trimLenVal">2.00s</strong>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="trim-modal-footer">
        <button id="inspectorTrashClipBtn" class="ghost-btn small danger-text" type="button" title="Move this clip to _trash/">
          Move Clip to Trash
        </button>

        <div class="trim-footer-right">
          <button id="trimSaveNewBtn" type="button" class="ghost-btn small" title="Keep existing clip untouched and save this In/Out as an extra clip">
            + Save as New Clip
          </button>
          <button id="trimSaveBtn" type="button" class="trim-btn-primary">
            ✓ Save Trim
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
